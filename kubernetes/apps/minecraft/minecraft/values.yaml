minecraft:
  image:
    repository: itzg/minecraft-server
    tag: java21
    pullPolicy: IfNotPresent

  replicaCount: 1

  strategyType: Recreate

  terminationGracePeriodSeconds: 120

  resources:
    requests:
      cpu: 1000m
      memory: 7Gi
    limits:
      cpu: 4000m
      memory: 10Gi

  startupProbe:
    enabled: true
    failureThreshold: 120
    periodSeconds: 15

  minecraftServer:
    whitelist: "f6711342-17ef-35fa-9dc5-078b0bfe88b8,51489f1d-efb1-3ff1-bd82-5e7e982ad0ae,286683ca-df47-3bf1-9f2f-2f2aa35bb710"
    ops: "f6711342-17ef-35fa-9dc5-078b0bfe88b8"
    eula: "TRUE"
    type: MODRINTH
    version: "1.20.1"

    worldSaveName: 0xk3m
    levelSeed: ""

    gameMode: survival
    difficulty: normal
    maxPlayers: 5
    viewDistance: 6
    motd: "Prominence II - Hasturian Era"

    memory: "7168M"

    onlineMode: false
    enforceSecureProfile: false

    serviceType: ClusterIP
    servicePort: 25565

    rcon:
      enabled: true
      withGeneratedPassword: false
      existingSecret: minecraft-rcon
      secretKey: rcon-password
      serviceType: ClusterIP
      port: 25575

    modrinth:
      projects:
        - athena-ctm
      downloadDependencies: required
      allowedVersionType: release

  extraEnv:
    MODRINTH_MODPACK: "https://modrinth.com/modpack/prominence-2-fabric/version/4.1.5hf"
    SIMULATION_DISTANCE: "5"
    ENABLE_WHITELIST: "true"
    ENFORCE_WHITELIST: "true"

  sidecarContainers:
    - name: playit
      image: ghcr.io/playit-cloud/playit-agent:1.2.0
      imagePullPolicy: IfNotPresent
      env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minecraft-playit
              key: secret-key
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: playit-run
          mountPath: /run/playit
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

  extraVolumes:
    - volumes:
        - name: playit-run
          emptyDir: {}

  persistence:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
      helm.sh/resource-policy: keep
    dataDir:
      enabled: true
      Size: 40Gi
      accessModes:
        - ReadWriteOnce

  mcbackup:
    enabled: true
    backupOnTerminate: true
    backupInterval: "24h"
    pruneBackupsDays: 7
    pauseIfNoPlayers: "true"
    backupMethod: tar
    compressMethod: gzip
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
        helm.sh/resource-policy: keep
      backupDir:
        enabled: true
        Size: 25Gi
        accessModes:
          - ReadWriteOnce

external-secret-helper:
  externalSecrets:
    - name: minecraft-rcon
      refreshInterval: 1h
      data:
        - secretKey: rcon-password
          remoteRef:
            key: minecraft/minecraft
            property: rcon-password
    - name: minecraft-playit
      refreshInterval: 1h
      data:
        - secretKey: secret-key
          remoteRef:
            key: minecraft/minecraft
            property: playit-secret-key

networkPolicy:
  enabled: false
  allowedCIDRs: []
