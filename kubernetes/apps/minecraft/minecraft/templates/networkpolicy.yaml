{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-allow-game
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minecraft
    app.kubernetes.io/managed-by: argocd
spec:
  # Selects the itzg minecraft pods (they carry app.kubernetes.io/name: minecraft).
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 25565
      {{- with .Values.networkPolicy.allowedCIDRs }}
      from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
{{- end }}
