app:
  replicaCount: 1

  image:
    repository: khimnguynn/dsh
    pullPolicy: IfNotPresent
    tag: "v1.0.0"

  serviceAccount:
    create: false

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    className: "cloudflare-tunnel"
    hosts:
      - host: dsh.0xk3m.dev
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  livenessProbe:
    httpGet: null
    tcpSocket:
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20

  readinessProbe:
    httpGet: null
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10

  strategy:
    type: Recreate

  persistence:
    state:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteOnce
      mountPath: /home/dsh/.dsh
    workspace:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      mountPath: /home/dsh/workspace

  env:
    - name: DSH_TELEMETRY_DISABLED
      value: "1"

  externalSecret:
    enabled: true
    refreshInterval: 1h
    secretStore:
      name: vault-backend
      kind: ClusterSecretStore
    secrets:
      - secretKey: DSH_BASIC_AUTH_USER
        remoteRef:
          key: app/deepseek
          property: DSH_BASIC_AUTH_USER
      - secretKey: DSH_BASIC_AUTH_PASS
        remoteRef:
          key: app/deepseek
          property: DSH_BASIC_AUTH_PASS
