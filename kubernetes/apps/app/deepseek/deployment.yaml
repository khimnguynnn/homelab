apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
  labels:
    app: dsh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dsh
  template:
    metadata:
      labels:
        app: dsh
    spec:
      containers:
        - name: dsh
          image: khimnguynn/dsh:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
          volumeMounts:
            - name: dsh-state
              mountPath: /home/dsh/.dsh
            - name: dsh-workspace
              mountPath: /home/dsh/workspace
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: dsh-state
          persistentVolumeClaim:
            claimName: dsh-state
        - name: dsh-workspace
          persistentVolumeClaim:
            claimName: dsh-workspace
